<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه آزمون زیست دهم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg1: #667eea;
    --bg2: #764ba2;
    --card: rgba(255,255,255,0.95);
    --text: #2c3e50;
    --text-soft: #7f8c8d;
    --border: rgba(0,0,0,0.08);
    --input-bg: #f7f9fc;
    --option-bg: #f7f9fc;
    --option-hover: #eef3ff;
    --shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  body.dark {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --card: rgba(30,41,59,0.95);
    --text: #e2e8f0;
    --text-soft: #94a3b8;
    --border: rgba(255,255,255,0.08);
    --input-bg: #1e293b;
    --option-bg: #1e293b;
    --option-hover: #334155;
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    transition: background .4s;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .4;
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 400px; height: 400px; background: #f093fb; top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
  body::after { width: 350px; height: 350px; background: #4facfe; bottom: -100px; left: -100px; animation: float 10s ease-in-out infinite reverse; }

  @keyframes float {
    0%,100% { transform: translateY(0) }
    50% { transform: translateY(30px) }
  }

  .theme-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 45px; height: 45px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 100;
    transition: transform .3s;
  }
  .theme-btn:hover { transform: rotate(20deg) scale(1.1); }

  .container {
    max-width: 720px;
    width: 100%;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative;
    z-index: 1;
    animation: slideUp .6s cubic-bezier(.2,.9,.3,1.3);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }

  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: var(--text-soft);
    margin-bottom: 30px;
    font-size: 14px;
  }

  label {
    display: block;
    margin: 18px 0 8px;
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    transition: all .25s;
    outline: none;
  }

  input:focus, select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
    background: var(--card);
  }

  button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    margin-top: 24px;
    width: 100%;
    transition: all .3s;
    box-shadow: 0 8px 20px rgba(102,126,234,0.3);
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(102,126,234,0.45);
  }

  button:active { transform: translateY(0); }

  .timer-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 15px;
  }

  .timer {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 8px 20px rgba(102,126,234,0.35);
    transition: all .3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .timer.warning {
    background: linear-gradient(135deg, #f5576c, #f093fb);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .progress-bar {
    height: 8px;
    background: var(--input-bg);
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 25px;
    flex: 1;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #f093fb);
    border-radius: 50px;
    transition: width .4s ease;
    width: 0%;
  }

  .question-counter {
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .question-card { animation: fadeIn .4s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-15px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .question-num {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 4px 14px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .question {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.9;
    margin-bottom: 22px;
    color: var(--text);
    white-space: pre-line;
  }

  .question-image {
    background: var(--input-bg);
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
    text-align: center;
    border: 2px dashed var(--border);
  }

  .question-image img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }

  .question-image .placeholder {
    color: var(--text-soft);
    font-size: 14px;
    font-style: italic;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--option-bg);
    padding: 14px 18px;
    margin: 10px 0;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .25s;
    font-size: 15px;
    color: var(--text);
  }

  .option:hover {
    background: var(--option-hover);
    transform: translateX(-4px);
    border-color: rgba(102,126,234,0.3);
  }

  .option.selected {
    background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(240,147,251,0.15));
    border-color: #667eea;
    font-weight: 600;
  }

  .option input {
    width: 20px; height: 20px;
    accent-color: #667eea;
    cursor: pointer;
    flex-shrink: 0;
  }

  .option-letter {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    color: #667eea;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .option.selected .option-letter {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border-color: transparent;
  }

  .nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 25px;
  }

  .nav button { flex: 1; margin-top: 0; }

  .nav button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-secondary {
    background: var(--input-bg) !important;
    color: var(--text) !important;
    box-shadow: none !important;
    border: 2px solid var(--border) !important;
  }

  .btn-secondary:hover { background: var(--option-hover) !important; }

  .btn-finish {
    background: linear-gradient(135deg, #f5576c, #f093fb) !important;
    box-shadow: 0 8px 20px rgba(245,87,108,0.35) !important;
    margin-top: 15px;
  }

  .report-header {
    text-align: center;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px dashed var(--border);
  }

  .report-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-radius: 10px;
    margin: 8px 0;
    background: var(--input-bg);
    font-size: 14px;
  }

  .report-item b { color: var(--text); font-weight: 700; }
  .report-item span { color: var(--text-soft); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 20px 0;
  }

  .stat {
    padding: 22px 10px;
    border-radius: 14px;
    text-align: center;
    color: #fff;
    font-weight: 700;
  }

  .stat.correct { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .stat.empty { background: linear-gradient(135deg, #757f9a, #d7dde8); }

  .stat-num { font-size: 30px; display: block; margin-bottom: 6px; }
  .stat-lbl { font-size: 12px; opacity: .95; }

  @media (max-width: 500px) {
    .container { padding: 25px 20px; border-radius: 18px; }
    h1 { font-size: 22px; }
    .question { font-size: 15px; }
    .option { font-size: 14px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="container">

  <!-- صفحه شروع -->
  <div id="startPage">
    <h1>🧬 سامانه آزمون زیست دهم</h1>
    <p class="subtitle">برای شروع، اطلاعات زیر را وارد کنید</p>

    <label>👤 نام و نام خانوادگی</label>
    <input id="fullName" placeholder="مثلاً: علی رضایی">

    <label>📚 انتخاب سرفصل</label>
    <select id="topic">
      <option value="زیست دهم - فصل ۱ (دنیای زنده)">زیست دهم - فصل ۱ (دنیای زنده)</option>
      <option value="زیست دهم - فصل ۲ (گوارش و جذب مواد)">زیست دهم - فصل ۲ (گوارش و جذب مواد)</option>
      <option value="زیست دهم - فصل ۳ (تبادلات گازی)">زیست دهم - فصل ۳ (تبادلات گازی)</option>
      <option value="زیست دهم - فصل ۴ (گردش مواد در بدن)">زیست دهم - فصل ۴ (گردش مواد در بدن)</option>
    </select>

    <label>⏱️ مدت زمان آزمون (دقیقه)</label>
    <input id="duration" type="number" value="25" min="1">

    <button onclick="startExam()">شروع آزمون 🚀</button>
  </div>

  <!-- صفحه آزمون -->
  <div id="examPage" class="hidden">
    <div class="timer-wrap">
      <div class="timer" id="timer">⏱️ 25:00</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="question-counter" id="counter">1 / 1</div>
    </div>

    <div id="questionBox"></div>

    <div class="nav">
      <button class="btn-secondary" onclick="prevQ()" id="prevBtn">قبلی</button>
      <button onclick="nextQ()" id="nextBtn">بعدی</button>
    </div>

    <button class="btn-finish" onclick="finishExam()">پایان آزمون و مشاهده کارنامه</button>
  </div>

  <!-- صفحه کارنامه -->
  <div id="reportPage" class="hidden">
    <div id="reportContent">
      <div class="report-header">
        <h1>🏆 کارنامه آزمون</h1>
        <p class="subtitle">نتیجه عملکرد شما</p>
      </div>

      <div class="report-item"><span>👤 نام و نام خانوادگی</span><b id="rName"></b></div>
      <div class="report-item"><span>📚 سرفصل</span><b id="rTopic"></b></div>
      <div class="report-item"><span>📝 تعداد کل سوالات</span><b id="rTotal"></b></div>
      <div class="report-item"><span>✅ تعداد سوالات پاسخ داده‌شده</span><b id="rAnswered"></b></div>
      <div class="report-item"><span>⭕ تعداد سوالات بدون پاسخ</span><b id="rEmpty"></b></div>
      <div class="report-item"><span>⏱️ مدت زمان کل آزمون</span><b id="rTotalTime"></b></div>
      <div class="report-item"><span>⌛ زمان صرف‌شده</span><b id="rUsedTime"></b></div>

      <div class="stats-grid">
        <div class="stat correct"><span class="stat-num" id="rAnsweredBig">0</span><span class="stat-lbl">پاسخ داده ✅</span></div>
        <div class="stat empty"><span class="stat-num" id="rEmptyBig">0</span><span class="stat-lbl">بدون پاسخ ⭕</span></div>
      </div>
    </div>

    <button onclick="downloadPDF()">📥 دانلود کارنامه PDF</button>
    <button class="btn-secondary" onclick="location.reload()" style="margin-top:10px">🔄 آزمون جدید</button>
  </div>

</div>

<script>
// ============ بانک سوالات ============
const questionBank = {

  "زیست دهم - فصل ۱ (دنیای زنده)": [
    {
      q: "کدام مورد، برای تکمیل عبارت زیر مناسب است؟ «مطابق با متن کتاب درسی، در ............ سطح سازمان‌یابی حیات، ............»",
      options: [
        "ششمین - مجموعه همه گره (الل)‌های افراد یک جمعیت، می‌تواند مورد بررسی قرار گیرد.",

        "در هشتمین سطح برخلاف هفتمین سطح، بررسی تعامل‌های مؤثر بر غذاسازی گیاهان امکان‌پذیر است."

      ],
      answer: 0

    {

      ],
      answer: 2
    },
    {
      q: "کدام عبارت جهت تکمیل عبارت زیر مناسب است؟ «در ............ سطح حیات برخلاف سطحی که بلافاصله ............ این سطح قرار دارد، ............»",
      options: [
        "هفتمین - قبل - تأثیر عوامل غیرزنده نیز باید در نظر گرفته شود.",
        "چهارمین - بعد - منحصراً جانداران یوکاریوتی بررسی می‌شوند.",
        "نهمین - قبل - جمعیت‌های مختلفی از انواعی از گونه‌ها، قرار خواهند داشت.",

    {
      q: "کدام مورد برای تکمیل عبارت زیر مناسب است؟ «مطابق با کتاب درسی در ............ سطوح سازمان‌یابی حیات، ............»",

      answer: 1
    },
    {
      q: "در ارتباط با انواع سطوح سازمان‌یابی حیات، چند مورد درست است؟",
      options: ["۴", "۳", "۲", "۱"],
      answer: 1

        "در پی اثر یک گاز تنفسی بر یاخته‌های دیواره آن‌ها، مصرف نوعی گاز تنفسی دیگر در آن‌ها کاهش می‌یابد."
      ],
      answer: 3
    },
    {
      q: "چند مورد، برای تکمیل عبارت زیر نامناسب است؟\n«در بدن انسان، درباره رگ خونی که خون را وارد یک شبکه مویرگی می‌کند، می‌توان گفت که ............»",
      options: [
        "الف) ممکن است فشار سرخرگی نقشی در ادامه جریان خون در آن نداشته باشد.",
        "ب) ممکن نیست نسبت به سرخرگ آئورت، مقاومت بیشتری داشته باشد.",
        "ج) به طور حتم، در لایه میانی خود، رشته‌های کشسان زیادی دارد.",
        "د) به طور حتم، دهانه آن حتی در نبود خون باز است."
      ],
      answer: 3
    }
  ]

};

// =================================================

let user = {}, answers = [], currentQ = 0, timeLeft = 0, timerInt, totalTime = 0, questions = [];

/* ---------- تم ---------- */
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent = '☀️';
}

/* ---------- شروع آزمون ---------- */
function startExam() {
  const nameInput = document.getElementById('fullName').value.trim();
  if (!nameInput) {
    shake(document.getElementById('fullName'));
    return;
  }
  user.name = nameInput;
  user.topic = document.getElementById('topic').value;
  user.duration = parseInt(document.getElementById('duration').value) || 25;

  questions = questionBank[user.topic] || [];
  if (questions.length === 0) {
    alert('سوالی برای این سرفصل یافت نشد!');
    return;
  }

  totalTime = user.duration * 60;
  timeLeft = totalTime;
  answers = new Array(questions.length).fill(null);

  document.getElementById('startPage').classList.add('hidden');
  document.getElementById('examPage').classList.remove('hidden');
  renderQuestion();
  startTimer();
}

function shake(el) {
  el.style.borderColor = '#f5576c';
  setTimeout(() => { el.style.borderColor = ''; }, 1200);
  el.animate([
    { transform: 'translateX(0)' },
    { transform: 'translateX(-8px)' },
    { transform: 'translateX(8px)' },
    { transform: 'translateX(-8px)' },
    { transform: 'translateX(0)' }
  ], { duration: 400 });
  el.focus();
}

/* ---------- تایمر ---------- */
function startTimer() {
  updateTimer();
  timerInt = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) finishExam();
  }, 1000);
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = `⏱️ ${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('warning', timeLeft <= 30);
}

/* ---------- نمایش سوال ---------- */
function renderQuestion() {
  const q = questions[currentQ];
  const letters = ['الف','ب','ج','د'];
  const box = document.getElementById('questionBox');
  
  let imageHTML = '';
  if (q.image) {
    imageHTML = `<div class="question-image"><img src="${q.image}" alt="تصویر سوال"></div>`;
  } else if (q.image === null) {
    imageHTML = `<div class="question-image"><div class="placeholder">📷 [تصویر این سوال در کتاب موجود است - لطفاً در صورت نیاز اضافه کنید]</div></div>`;
  }
  
  box.innerHTML = `
    <div class="question-card">
      <div class="question-num">سوال ${currentQ+1}</div>
      <div class="question">${q.q}</div>
      ${imageHTML}
      ${q.options.map((opt, i) => `
        <label class="option ${answers[currentQ]===i?'selected':''}" data-i="${i}">
          <input type="radio" name="opt" value="${i}" ${answers[currentQ]===i?'checked':''} onchange="pick(${i})">
          <span class="option-letter">${letters[i]||i+1}</span>
          <span>${opt}</span>
        </label>`).join('')}
    </div>`;

  const pct = ((currentQ + 1) / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = `${currentQ+1} / ${questions.length}`;

  document.getElementById('prevBtn').disabled = currentQ === 0;
  document.getElementById('nextBtn').disabled = currentQ === questions.length - 1;
}

function pick(i) {
  answers[currentQ] = i;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  document.querySelector(`.option[data-i="${i}"]`).classList.add('selected');
}

function nextQ() { if (currentQ < questions.length-1) { currentQ++; renderQuestion(); } }
function prevQ() { if (currentQ > 0) { currentQ--; renderQuestion(); } }

/* ---------- پایان و کارنامه ---------- */
function finishExam() {
  clearInterval(timerInt);
  const usedTime = totalTime - timeLeft;

  let answered = 0, empty = 0;
  questions.forEach((q, i) => {
    if (answers[i] === null) empty++;
    else answered++;
  });

  document.getElementById('examPage').classList.add('hidden');
  document.getElementById('reportPage').classList.remove('hidden');

  document.getElementById('rName').textContent = user.name;
  document.getElementById('rTopic').textContent = user.topic;
  document.getElementById('rTotal').textContent = questions.length + ' سوال';
  document.getElementById('rAnswered').textContent = answered + ' سوال';
  document.getElementById('rEmpty').textContent = empty + ' سوال';
  document.getElementById('rTotalTime').textContent = user.duration + ' دقیقه';
  document.getElementById('rUsedTime').textContent = formatTime(usedTime);
  document.getElementById('rAnsweredBig').textContent = answered;
  document.getElementById('rEmptyBig').textContent = empty;
}

function formatTime(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return `${m} دقیقه و ${s} ثانیه`;
}

/* ---------- دانلود PDF ---------- */
function downloadPDF() {
  const el = document.getElementById('reportContent');
  const isDark = document.body.classList.contains('dark');
  html2pdf().set({
    margin: 10,
    filename: `کارنامه_${user.name}.pdf`,
    html2canvas: { scale: 2, backgroundColor: isDark ? '#1e293b' : '#ffffff' },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(el).save();
}
